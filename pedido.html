<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu pedido — Apetrechos Calçados</title>
  <meta name="description" content="Acompanhe o status do seu pedido na Apetrechos Calçados.">
  <meta name="theme-color" content="#FF66C4">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Mulish:wght@300;400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="pedido.html">
  <a class="skip-link" href="#main">Ir para o conteúdo principal</a>
  <div id="header"></div>

  <main id="main" class="container section">
    <div class="panel" style="max-width:560px;margin-inline:auto;text-align:center">
      <div id="order-status">
        <div class="empty-state" style="padding-block:var(--sp-6)">
          <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <h3 style="margin-top:var(--sp-4)">Recebemos seu pedido!</h3>
          <p class="text-muted" id="order-msg">Estamos confirmando o pagamento…</p>
          <p id="order-ref" class="text-muted" style="font-size:var(--fs-xs);margin-top:8px"></p>
        </div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:var(--sp-4)">
        <a class="btn btn-ink" href="categoria.html">Continuar comprando</a>
        <a class="btn btn-outline" id="order-wa" href="#" target="_blank" rel="noopener">Falar no WhatsApp</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <div id="drawers"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/imagery.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/demo-agent.js"></script>
  <script>
    (function () {
      var ref = new URLSearchParams(location.search).get('ref') || '';
      var refEl = document.getElementById('order-ref');
      var msgEl = document.getElementById('order-msg');
      var statusEl = document.getElementById('order-status');
      document.getElementById('order-wa').href = 'https://wa.me/' + CONFIG.whatsapp;
      if (ref) refEl.textContent = 'Código do pedido: ' + ref;

      // O pedido foi criado no servidor — esvazia a sacola para não duplicar.
      try { Store.clear(); localStorage.removeItem('apx.coupon.v1'); } catch (e) {}

      var api = (CONFIG.checkoutApi || '').replace(/\/$/, '');
      if (!api || !ref) {
        msgEl.textContent = 'Obrigado pela compra! Em breve entramos em contato para combinar a entrega.';
        return;
      }

      var tries = 0;
      function paidView() {
        statusEl.innerHTML =
          '<div class="empty-state" style="padding-block:var(--sp-6)">'
          + '<svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color:var(--success)"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>'
          + '<h3 style="margin-top:var(--sp-4)">Pagamento confirmado! 🎉</h3>'
          + '<p class="text-muted">Seu pedido está sendo preparado. Você recebe o código de rastreio assim que ele for postado.</p>'
          + '<p class="text-muted" style="font-size:var(--fs-xs);margin-top:8px">Código do pedido: ' + ref + '</p></div>';
      }
      function poll() {
        fetch(api + '/order/' + encodeURIComponent(ref))
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (d && d.status === 'paid') { paidView(); return; }
            if (++tries < 20) { setTimeout(poll, 3000); }
            else { msgEl.textContent = 'Assim que o pagamento for confirmado, seu pedido entra em preparação. Qualquer dúvida, chame no WhatsApp.'; }
          })
          .catch(function () { if (++tries < 20) setTimeout(poll, 4000); });
      }
      poll();
    })();
  </script>
</body>
</html>
