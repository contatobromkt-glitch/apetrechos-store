<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine, Apetrechos Calçados</title>
  <meta name="description" content="Explore a vitrine completa de calçados femininos: filtre por categoria, numeração, cor, marca e faixa de preço.">
  <meta name="theme-color" content="#FF66C4">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Mulish:wght@300;400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="categoria.html">
  <a class="skip-link" href="#main">Ir para o conteúdo principal</a>
  <div id="header"></div>

  <main id="main" class="container">
    <nav class="breadcrumb" aria-label="Você está em" id="breadcrumb"></nav>

    <header class="plp-head">
      <div>
        <h1 class="section-title" id="plp-title">Vitrine</h1>
        <p class="plp-count" id="plp-count" aria-live="polite"></p>
      </div>
    </header>

    <div class="plp-layout">
      <!-- Filtros (desktop) --------------------------------------------->
      <aside class="filters" id="filters-desktop" aria-label="Filtros"></aside>

      <!-- Resultados ----------------------------------------------------->
      <section aria-label="Produtos">
        <div class="toolbar">
          <button class="btn btn-outline filter-fab" type="button" data-open-drawer="drawer-filters">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            Filtrar
          </button>
          <div class="select-wrap" style="margin-left:auto">
            <label class="sr-only" for="sort">Ordenar por</label>
            <select id="sort" class="btn btn-outline" style="border-radius:var(--r-full)">
              <option value="relevance">Mais relevantes</option>
              <option value="price-asc">Menor preço</option>
              <option value="price-desc">Maior preço</option>
              <option value="discount">Maior desconto</option>
              <option value="rating">Melhor avaliados</option>
            </select>
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="active-filters" id="active-filters"></div>
        <div class="grid-products is-wide" id="plp-grid"></div>
        <div class="pagination" id="plp-more"></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>
  <div id="drawers"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/imagery.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/plp.js"></script>
  <script src="assets/js/demo-agent.js"></script>
</body>
</html>
